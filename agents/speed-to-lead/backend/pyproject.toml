[tool.poetry]
name = "speed-to-lead"
version = "1.0.0"
description = "WhatsApp AI Agent for Real Estate and Interior Design lead qualification"
authors = ["pavan kumar.v <admin@innovizeai.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# Web framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
python-multipart = "^0.0.9"

# LangGraph + LangChain
langgraph = ">=0.2.28"
langchain = ">=0.3.3"
langchain-core = ">=0.3.10"
google-genai = ">=1.0.0"
langchain-google-genai = "^4.0.0"
langchain-google-vertexai = "^2.0.0"
langsmith = ">=0.1.130"

# Vertex AI SDK
google-cloud-aiplatform = ">=1.67.0"

# Google Cloud Vision + Document AI (OCR for scanned PDFs)
google-cloud-vision = ">=3.0.0"
google-cloud-documentai = ">=2.0.0"

# Pinecone
pinecone = "^6.0.0"

# Supabase (Storage client only)
supabase = "^2.7.4"

# SQLAlchemy + async driver
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
psycopg = {extras = ["asyncio", "binary"], version = "^3.2.0"}

# Alembic (migrations) — uses psycopg2 for sync connection
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"

# Settings + validation
pydantic-settings = "^2.5.2"
pydantic = "^2.9.2"

# PDF ingestion (scripts)
pypdf = "^4.3.1"
PyMuPDF = "^1.24.10"

# HTTP client (Meta API)
httpx = "^0.28.0"

# Scheduler (follow-up + reminder dispatch)
apscheduler = "^3.10.0"

# Utilities
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
