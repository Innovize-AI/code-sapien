# Speed to Lead: build and deploy the backend and frontend to Cloud Run.
# Modelled on demos/workflow-demos/rfq-agent/cloudbuild.yaml. Run from the REPO ROOT:
#
#   gcloud builds submit --config agents/speed-to-lead/cloudbuild.yaml \
#     --substitutions=_SUPABASE_URL=https://YOUR-PROJECT.supabase.co,_SUPABASE_ANON_KEY=YOUR-ANON-KEY .
#
# or point a Cloud Build trigger at this file on the speed-to-lead branch.
#
# One-time setup before the first run (see the notes at the bottom of this file):
#   1. Artifact Registry repo named speed-to-lead in ${_AR_REGION}
#   2. The Secret Manager secrets listed under --set-secrets below
#   3. Cloud Run service account has Secret Manager Secret Accessor
#
# Keep the backend at ONE instance. The follow-up scheduler runs inside the server, so a second
# instance would send every follow-up twice, and scaling to zero would stop them.

substitutions:
  _AR_REGION: asia-south1          # Artifact Registry region
  _CR_REGION: us-central1          # Cloud Run region
  _REPO: speed-to-lead
  _BACKEND_SERVICE: speed-to-lead-backend
  _FRONTEND_SERVICE: speed-to-lead-frontend
  # staging keeps the Pinecone index speed-to-lead-staging and redirects every WhatsApp reply to
  # _TEST_FORWARD_NUMBER. production uses the speed-to-lead index and messages real people.
  _ENVIRONMENT: staging
  _TEST_FORWARD_NUMBER: ""
  _FALLBACK_ALERT_EMAIL: admin@innovizeai.com
  _BOOKING_LINK: ""
  # Public values for the frontend build (NEXT_PUBLIC_* is baked in at build time). Pass at submit time.
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""
  # The webhook URL you register in Meta (it ends in /webhook). Leave empty to use the Cloud Run address,
  # which is worked out after the first deploy. Set it when you use a custom domain, for example
  # https://api.yourdomain.com/webhook, so a redeploy never changes it.
  _META_WEBHOOK_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:

  # ── 0. Preflight: stop early on a setup that would misbehave ───────────────
  - id: preflight
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        fail=0
        if [ -z "${_SUPABASE_URL}" ] || [ -z "${_SUPABASE_ANON_KEY}" ]; then
          echo "ERROR: pass _SUPABASE_URL and _SUPABASE_ANON_KEY. Without them sign-in cannot work."
          fail=1
        fi
        if [ "${_ENVIRONMENT}" != "production" ] && [ -z "${_TEST_FORWARD_NUMBER}" ]; then
          echo "ERROR: a non-production deploy must set _TEST_FORWARD_NUMBER, otherwise its replies go to real buyers."
          fail=1
        fi
        exit $$fail

  # ── 1. Build backend image ──────────────────────────────────────────────────
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - ./agents/speed-to-lead/backend

  # ── 2. Push backend image ───────────────────────────────────────────────────
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend]
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend

  # ── 3. Deploy backend to Cloud Run ─────────────────────────────────────────
  # The container runs "alembic upgrade head" on start, then the API on port 8080.
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-backend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
      - --region=${_CR_REGION}
      - --platform=managed
      - --allow-unauthenticated        # Meta must reach /webhook; the app enforces its own sign-in
      - --min-instances=0              # keeps the in-process follow-up scheduler running
      - --max-instances=1              # one scheduler only, no duplicate follow-ups
      - --no-cpu-throttling            # the scheduler works between requests
      - --memory=1Gi
      - --cpu=1
      - --port=8080
      - --timeout=300
      - --set-env-vars=^|^ENVIRONMENT=${_ENVIRONMENT}|SUPABASE_URL=${_SUPABASE_URL}|TEST_FORWARD_NUMBER=${_TEST_FORWARD_NUMBER}|FALLBACK_ALERT_EMAIL=${_FALLBACK_ALERT_EMAIL}|BOOKING_LINK=${_BOOKING_LINK}|META_WEBHOOK_URL=${_META_WEBHOOK_URL}
      - --set-secrets=DATABASE_URL=stl-database-url:latest,GOOGLE_API_KEY=stl-google-api-key:latest,PINECONE_API_KEY=stl-pinecone-api-key:latest,SUPABASE_ANON_KEY=stl-supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=stl-supabase-service-role-key:latest,META_ACCESS_TOKEN=stl-meta-access-token:latest,META_WEBHOOK_VERIFY_TOKEN=stl-meta-webhook-verify-token:latest,META_APP_SECRET=stl-meta-app-secret:latest,GMAIL_USER=stl-gmail-user:latest,GMAIL_PASSWORD=stl-gmail-password:latest,LANGCHAIN_API_KEY=stl-langchain-api-key:latest
      - --quiet

  # ── 4. Capture the backend URL ──────────────────────────────────────────────
  - id: get-backend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy-backend]
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_CR_REGION} \
          --format="value(status.url)")
        echo "Backend URL: $$URL"
        echo -n "$$URL" > /workspace/backend_url.txt

  # ── 5. Set the webhook URL when none was given ─────────────────────────────
  # With _META_WEBHOOK_URL set, it was already applied at deploy time and this step only reports it.
  # Without it, the Cloud Run address is only known after the first deploy, so it is worked out here.
  # Either way it is logged at startup as the address to register as the callback in the Meta app.
  - id: set-webhook-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [get-backend-url]
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        if [ -n "${_META_WEBHOOK_URL}" ]; then
          echo "Register this callback URL in Meta: ${_META_WEBHOOK_URL}"
        else
          gcloud run services update ${_BACKEND_SERVICE} \
            --region=${_CR_REGION} \
            --update-env-vars=META_WEBHOOK_URL="$$BACKEND_URL/webhook" \
            --quiet
          echo "Register this callback URL in Meta: $$BACKEND_URL/webhook"
        fi

  # ── 6. Build frontend image (bakes the backend URL and Supabase keys into Next.js) ──
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [get-backend-url]
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        docker build \
          --build-arg NEXT_PUBLIC_API_URL="$$BACKEND_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${_SUPABASE_ANON_KEY}" \
          -t ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID \
          -t ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest \
          ./agents/speed-to-lead/frontend

  # ── 7. Push frontend image ──────────────────────────────────────────────────
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-frontend]
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend

  # ── 8. Deploy frontend to Cloud Run ────────────────────────────────────────
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-frontend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID
      - --region=${_CR_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --memory=512Mi
      - --cpu=1
      - --port=3000
      - --quiet

images:
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID

# ── Notes ─────────────────────────────────────────────────────────────────────
# Secret Manager names used above (create each one, value from backend/.env):
#   stl-database-url  stl-google-api-key  stl-pinecone-api-key  stl-supabase-anon-key
#   stl-supabase-service-role-key  stl-meta-access-token  stl-meta-webhook-verify-token
#   stl-meta-app-secret  stl-gmail-user  stl-gmail-password  stl-langchain-api-key
#
# Create a secret:
#   printf '%s' "$VALUE" | gcloud secrets create stl-google-api-key --data-file=-
#
# After the first deploy:
#   - Register the callback URL printed by step 5 in the Meta app, with META_WEBHOOK_VERIFY_TOKEN.
#   - In Supabase (Authentication, URL Configuration) add the frontend service URL as the site URL.
#   - Production uses the Pinecone index "speed-to-lead". Ingest the knowledge base there, or deploy
#     with _ENVIRONMENT=staging first.
#   - The backend allows requests from any origin (CORS *). Restrict it to the frontend URL before go-live.
