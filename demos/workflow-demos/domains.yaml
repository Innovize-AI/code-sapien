# Subdomain → Cloud Run service mappings for demos.innovizeai.com
# Add a new entry here when you build a new demo service.
# Run setup-domains.sh after editing to apply mappings and get DNS records.

base_domain: demos.innovizeai.com
region: us-central1

services:
  - subdomain: rfq
    frontend_service: rfq-frontend
    backend_service: rfq-backend
    description: RFQ Agent — automated quotation from emails

