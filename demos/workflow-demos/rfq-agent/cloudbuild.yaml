substitutions:
  _AR_REGION: asia-south1    # Artifact Registry region (where repo was created)
  _CR_REGION: us-central1    # Cloud Run region (must support domain mappings)
  _REPO: rfq-agent
  _BACKEND_SERVICE: rfq-backend
  _FRONTEND_SERVICE: rfq-frontend
  _COMPANY_NAME: InnovizeAI
  _REVIEWER_EMAIL: admin@innovizeai.com
  _PUBSUB_TOPIC: rfq-gmail-push
  _PUBSUB_SUB: rfq-gmail-push-sub

options:
  logging: CLOUD_LOGGING_ONLY

steps:

  # ── 1. Build backend image ──────────────────────────────────────────────────
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - ./demos/workflow-demos/rfq-agent/backend

  # ── 2. Push backend image ───────────────────────────────────────────────────
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend]
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend

  # ── 3. Deploy backend to Cloud Run ─────────────────────────────────────────
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-backend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - --region=${_CR_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --memory=1Gi
      - --cpu=1
      - --port=8080
      - --timeout=300
      - --set-env-vars=ENVIRONMENT=production,DB_SCHEMA=rfq,COMPANY_NAME=${_COMPANY_NAME},REVIEWER_EMAIL=${_REVIEWER_EMAIL},SLACK_REVIEW_CHANNEL=#rfq-review,EMAIL_POLL_INTERVAL=60,PUBSUB_TOPIC=projects/$PROJECT_ID/topics/${_PUBSUB_TOPIC}
      - --set-secrets=DATABASE_URL=rfq-database-url:latest,GOOGLE_API_KEY=rfq-google-api-key:latest,ANTHROPIC_API_KEY=rfq-anthropic-api-key:latest,GOOGLE_OAUTH_CREDENTIALS=rfq-google-oauth-creds:latest,GMAIL_USER=rfq-gmail-sender:latest,GMAIL_PASSWORD=rfq-gmail-password:latest,LANGCHAIN_API_KEY=rfq-langchain-api-key:latest,SLACK_WEBHOOK_URL=rfq-slack-webhook:latest,PUBSUB_VERIFY_TOKEN=rfq-pubsub-verify-token:latest
      - --quiet

  # ── 4. Capture backend URL → /workspace/backend_url.txt ────────────────────
  - id: get-backend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy-backend]
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_CR_REGION} \
          --format="value(status.url)")
        echo "Backend URL: $$URL"
        echo -n "$$URL" > /workspace/backend_url.txt

  # ── 5. Wire Pub/Sub push subscription → backend webhook ───────────────────
  - id: setup-pubsub
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [get-backend-url]
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        ENDPOINT="$$BACKEND_URL/api/webhook/gmail"
        echo "Pub/Sub push endpoint: $$ENDPOINT"

        if gcloud pubsub subscriptions describe ${_PUBSUB_SUB} \
             --project=$PROJECT_ID &>/dev/null; then
          gcloud pubsub subscriptions modify-push-config ${_PUBSUB_SUB} \
            --push-endpoint="$$ENDPOINT" \
            --project=$PROJECT_ID
          echo "Updated push subscription endpoint"
        else
          gcloud pubsub subscriptions create ${_PUBSUB_SUB} \
            --topic=${_PUBSUB_TOPIC} \
            --push-endpoint="$$ENDPOINT" \
            --ack-deadline=60 \
            --project=$PROJECT_ID
          echo "Created push subscription: ${_PUBSUB_SUB}"
        fi

  # ── 6. Build frontend image (bakes backend URL into Next.js rewrites) ───────
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [get-backend-url]
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        docker build \
          --build-arg BACKEND_URL="$$BACKEND_URL" \
          -t ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA \
          -t ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest \
          ./demos/workflow-demos/rfq-agent/frontend

  # ── 7. Push frontend image ──────────────────────────────────────────────────
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-frontend]
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend

  # ── 8. Deploy frontend to Cloud Run ────────────────────────────────────────
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-frontend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
      - --region=${_CR_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --memory=512Mi
      - --cpu=1
      - --port=3000
      - --quiet


images:
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
