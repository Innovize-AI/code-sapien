steps:
  # 1. Build and push images using Skaffold
  - name: "gcr.io/k8s-skaffold/skaffold"
    id: skaffold-build
    dir: "sales-research/backend"
    entrypoint: "/bin/bash"
    args:
      - "-c"
      - |
        skaffold build \
          --interactive=false \
          --default-repo="us-central1-docker.pkg.dev/${PROJECT_ID}/sales-research" \
          --file-output=artifacts.json \
          -f skaffold.yaml

  # 2. Deploy and Run Migration Job (Staging)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: run-migrations-staging
    dir: "sales-research/backend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # Get the image with SHA from skaffold output
        IMAGE_WITH_SHA=$$(jq -r '.builds[0].tag' artifacts.json)

        # Replace image in Job manifest and deploy job
        sed -i "s|image:.*|image: $${IMAGE_WITH_SHA}|" deploy/migration-job-staging.yaml
        gcloud run jobs replace deploy/migration-job-staging.yaml --region=us-central1

        # Execute the job
        gcloud run jobs execute glial-backend-migrate-staging --region=us-central1 --wait

  # 3. Create Cloud Deploy Release
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: trigger-deploy
    dir: "sales-research/backend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud deploy releases create "rel-b-${SHORT_SHA}-$$(echo ${BUILD_ID} | cut -c1-8)" \
          --delivery-pipeline="glial-sales-backend-pipeline" \
          --region="us-central1" \
          --build-artifacts="artifacts.json"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
