steps:
  # 1. Build and Create Release for Backend
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "deploy"
      - "releases"
      - "create"
      - "rel-backend-${SHORT_SHA}-${BUILD_ID}"
      - "--delivery-pipeline"
      - "glial-sales-backend-pipeline"
      - "--region"
      - "us-central1"
      - "--skaffold-file"
      - "skaffold.yaml"
      - "--source"
      - "."
    dir: "sales-research/backend"

options:
  logging: CLOUD_LOGGING_ONLY
