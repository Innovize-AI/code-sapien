steps:
  # 1. Build and Create Release for Backend
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud deploy releases create "rel-b-${SHORT_SHA}-$$(echo ${BUILD_ID} | cut -c1-8)" \
          --delivery-pipeline="glial-sales-backend-pipeline" \
          --region="us-central1" \
          --skaffold-file="skaffold.yaml" \
          --source="."
    dir: "sales-research/backend"

options:
  logging: CLOUD_LOGGING_ONLY
