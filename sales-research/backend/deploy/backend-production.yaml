apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: glial-research-backend-service
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - image: us-central1-docker.pkg.dev/innovize-ai/docker-repo/glial-research-backend-image
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: ENVIRONMENT
              value: production
            - name: DB_SCHEMA
              value: public
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app"
