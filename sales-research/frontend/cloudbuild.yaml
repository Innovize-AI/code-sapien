steps:
  # 1. Build and push images using Skaffold
  - name: "gcr.io/k8s-skaffold/skaffold"
    id: skaffold-build
    dir: "sales-research/frontend"
    entrypoint: "/bin/bash"
    args:
      - "-c"
      - |
        skaffold build \
          --interactive=false \
          --default-repo="us-central1-docker.pkg.dev/${PROJECT_ID}/sales-research" \
          --file-output=artifacts.json \
          -f skaffold.yaml

  # 2. Create Cloud Deploy Release
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: trigger-deploy
    dir: "sales-research/frontend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud deploy releases create "rel-f-${SHORT_SHA}-$$(echo ${BUILD_ID} | cut -c1-8)" \
          --delivery-pipeline="glial-sales-frontend-pipeline" \
          --region="us-central1" \
          --build-artifacts="artifacts.json"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
