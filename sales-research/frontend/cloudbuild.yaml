steps:
  # 1. Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/glial-research-frontend:$COMMIT_SHA",
        "-t",
        "gcr.io/$PROJECT_ID/glial-research-frontend:latest",
        ".",
      ]
    dir: "sales-research/frontend"

  # 2. Push the image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/glial-research-frontend:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/glial-research-frontend:latest"]

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "glial-research-frontend-service"
      - "--image"
      - "gcr.io/$PROJECT_ID/glial-research-frontend:$COMMIT_SHA"
      - "--platform"
      - "managed"
      - "--region"
      - "us-central1"
      - "--port"
      - "3000"
      - "--no-allow-unauthenticated"

images:
  - "gcr.io/$PROJECT_ID/glial-research-frontend:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/glial-research-frontend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
