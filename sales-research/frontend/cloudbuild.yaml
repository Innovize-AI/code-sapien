steps:
  # 1. Build and Create Release for Frontend
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "deploy"
      - "releases"
      - "create"
      - "rel-frontend-${SHORT_SHA}"
      - "--delivery-pipeline"
      - "glial-sales-frontend-pipeline"
      - "--region"
      - "us-central1"
      - "--skaffold-file"
      - "skaffold.yaml"
      - "--source"
      - "."
    dir: "sales-research/frontend"

options:
  logging: CLOUD_LOGGING_ONLY
