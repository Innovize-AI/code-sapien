apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: glial-research-frontend-service
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      containers:
        - image: us-central1-docker.pkg.dev/innovize-ai/docker-repo/glial-research-frontend-image
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
