apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: glial-research-frontend-service-staging
  annotations:
    run.googleapis.com/minScale: "1"
    run.googleapis.com/cpu-throttling: false
    run.googleapis.com/invoker-iam-disabled: false
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: false
    spec:
      containerConcurrency: 80
      containers:
        - image: us-central1-docker.pkg.dev/innovize-ai/sales-research/glial-research-frontend-image:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
