apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: glial-research-frontend-service
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/glial-research-frontend:latest
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://glial-research-backend-service-uvw-uc.a.run.app"
          ports:
            - containerPort: 3000
