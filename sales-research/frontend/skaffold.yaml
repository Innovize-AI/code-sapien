apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: glial-sales-research-frontend
build:
  artifacts:
    - image: us-central1-docker.pkg.dev/innovize-ai/docker-repo/glial-research-frontend-image
      context: .
profiles:
  - name: staging
    manifests:
      rawYaml:
        - deploy/frontend-staging.yaml
  - name: production
    manifests:
      rawYaml:
        - deploy/frontend-production.yaml
deploy:
  cloudrun: {}
